name: CI - Rehber Doğrulama & Kalite Kontrolü

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python 3.12 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rehberleri Doğrula
        run: python scripts/validate_guides.py

      - name: Arama Motorunu Test Et
        run: |
          python scripts/search_guides.py --list
          python scripts/search_guides.py "bloke"
          python scripts/search_guides.py "fatura" --json
